<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Browser Bridge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header>
        <div>
          <h1>Codex Browser Bridge</h1>
          <p>Microsoft Edge 窗口授权 · Phase 2</p>
        </div>
        <span id="connection" class="status">检查中</span>
      </header>

      <button id="connectMcp" class="secondary">连接 MCP</button>
      <div id="mcpConnectResult" class="url" aria-live="polite"></div>
      <section class="card">
        <div class="label">当前窗口</div>
        <div id="title" class="title">—</div>
        <div id="url" class="url">—</div>
      </section>

      <button id="authorize" class="primary" disabled>授权当前窗口</button>
      <button id="diagnostics" class="secondary" disabled>开启 Console / Network 诊断</button>

      <section class="notice">
        <strong>权限边界</strong>
        <span>Codex 只能操作当前已授权 Edge 窗口中的页面。文件上传会临时启用 CDP，完成后立即释放。</span>
      </section>

      <section class="audit-card">
        <div class="audit-head">
          <div>
            <div class="label">最近操作</div>
            <div class="audit-subtitle">不记录输入正文和本地文件路径</div>
          </div>
          <button id="clearAudit" class="link">清除</button>
        </div>
        <div id="auditList" class="audit-list"></div>
      </section>

      <section class="card">
        <div class="label">PS 调试日志</div>
        <p>通过本机通信组件和 Windows COM 置入 PS，无需 MCP 或 PS 插件桥接。</p>
        <button id="psLogsRefresh" class="link">查看 / 刷新</button>
        <button id="psLogsExport" class="link">导出日志</button>
        <button id="psLogsClear" class="link">清除日志</button>
        <pre id="psLogs" style="max-height:220px;overflow:auto;white-space:pre-wrap;font-size:11px"></pre>
      </section>
      <footer>
        <span id="authorizedCount">未授权窗口</span>
        <button id="refresh" class="link">刷新状态</button>
      </footer>
      <div id="error" class="error" hidden></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
